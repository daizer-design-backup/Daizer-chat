name: Build Daizer Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build Android Docker image
        run: docker build -t signal-android ./reproducible-builds

      - name: Build Daizer Chat APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            signal-android \
            ./gradlew assembleWebsiteProdRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daizer-Chat-APK
          path: app/build/outputs/apk/websiteProdRelease/*.apk
